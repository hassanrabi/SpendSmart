<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendSmart - Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Header -->
    <header class="app-header">
        <div class="header-container">
            <h1 class="brand-logo">SpendSmart</h1>
            <button id="open-modal-btn" class="btn-primary">+ Add Transaction</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="dashboard-container">

        <!-- Summary Cards Section -->
        <section class="summary-section">
            <div class="summary-card balance-card">
                <span class="card-label">Total Balance</span>
                <h2 id="total-balance" class="card-value">$0.00</h2>
            </div>

            <div class="summary-card income-card">
                <span class="card-label">Total Income</span>
                <h2 id="total-income" class="card-value">$0.00</h2>
            </div>

            <div class="summary-card expense-card">
                <span class="card-label">Total Expenses</span>
                <h2 id="total-expense" class="card-value">$0.00</h2>
            </div>
        </section>

        <!-- Data & Visuals Split Section -->
        <section class="content-split">
            
            <!-- Left Column: Visual Chart -->
            <div class="panel chart-panel">
                <h3 class="panel-title">Expense Breakdown</h3>
                <div class="chart-wrapper">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

            <!-- Right Column: Transaction History -->
            <div class="panel history-panel">
                <h3 class="panel-title">Recent Transactions</h3>
                <ul id="transaction-list" class="transaction-list">
                    <!-- Dynamic list items will be added here via JS -->
                </ul>
            </div>

        </section>

    </main>

    <!-- Add Transaction Modal (Hidden by default via CSS) -->
    <div id="transaction-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>New Transaction</h3>
                <button id="close-modal-btn" class="btn-close">&times;</button>
            </div>

            <form id="transaction-form" class="transaction-form">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Groceries, Salary" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Transport">Transport</option>
                        <option value="Salary">Salary</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Save Transaction</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
